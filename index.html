<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? | 점심 메뉴 추천</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #f7f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: #ffffff;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        header h1 {
            color: #ff6b6b;
            font-size: 1.8rem;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            text-align: center;
        }

        /* 메인 추천 섹션 */
        .random-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .category-tag {
            display: inline-block;
            padding: 6px 14px;
            background-color: #ffe3e3;
            color: #ff6b6b;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .menu-display {
            font-size: 2.2rem;
            font-weight: bold;
            color: #222;
            margin-bottom: 25px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-recommend {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
        }

        .btn-recommend:hover {
            background-color: #ff5252;
        }

        .btn-recommend:active {
            transform: scale(0.98);
        }

        /* 카테고리 필터 섹션 */
        .category-section {
            background: #ffffff;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .category-section h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #555;
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-filter {
            background-color: #f1f3f5;
            border: none;
            padding: 8px 16px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #495057;
            transition: all 0.2s;
        }

        .btn-filter.active, .btn-filter:hover {
            background-color: #339af0;
            color: white;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: #aaa;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍱 오늘 뭐 먹지?</h1>
    </header>

    <div class="container">
        <!-- 랜덤 추천 결과 상자 -->
        <div class="random-box">
            <div class="category-tag" id="categoryTag">전체</div>
            <div class="menu-display" id="menuDisplay">버튼을 눌러주세요!</div>
            <button class="btn-recommend" onclick="recommendMenu()">점심 메뉴 추천받기</button>
        </div>

        <!-- 카테고리 선택 필터 -->
        <div class="category-section">
            <h3>원하는 종류가 있으신가요?</h3>
            <div class="filter-buttons">
                <button class="btn-filter active" onclick="setCategory('전체', this)">전체</button>
                <button class="btn-filter" onclick="setCategory('한식', this)">한식</button>
                <button class="btn-filter" onclick="setCategory('중식', this)">중식</button>
                <button class="btn-filter" onclick="setCategory('일식', this)">일식</button>
                <button class="btn-filter" onclick="setCategory('양식', this)">양식</button>
                <button class="btn-filter" onclick="setCategory('분식/기타', this)">분식/기타</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Today's Lunch Recommendation. All rights reserved.</p>
    </footer>

    <script>
        // 메뉴 데이터 정의
        const menuList = [
            // 한식
            { name: "김치찌개 🍲", category: "한식" },
            { name: "된장찌개 🍲", category: "한식" },
            { name: "제육볶음 🥩", category: "한식" },
            { name: "비빔밥 🥗", category: "한식" },
            { name: "국밥 (돼지/순대) 🥣", category: "한식" },
            { name: "부대찌개 🥘", category: "한식" },
            { name: "불고기 덮밥 🍚", category: "한식" },
            
            // 중식
            { name: "짜장면 🍜", category: "중식" },
            { name: "짬뽕 🌶️", category: "중식" },
            { name: "볶음밥 🥠", category: "중식" },
            { name: "마라탕 🍲", category: "중식" },
            { name: "탕수육 & 군만두 🥟", category: "중식" },

            // 일식
            { name: "돈가스 🥩", category: "일식" },
            { name: "초밥 🍣", category: "일식" },
            { name: "라멘 🍜", category: "일식" },
            { name: "가츠동 (덮밥) 🍱", category: "일식" },
            { name: "우동 & 모밀 🍥", category: "일식" },

            // 양식
            { name: "파스타 🍝", category: "양식" },
            { name: "수제버거 🍔", category: "양식" },
            { name: "피자 🍕", category: "양식" },
            { name: "스테이크 샐러드 🥗", category: "양식" },

            // 분식/기타
            { name: "떡볶이 & 튀김 떡", category: "분식/기타" },
            { name: "김밥 & 라면 🍙", category: "분식/기타" },
            { name: "샌드위치 & 샐러드 🥪", category: "분식/기타" },
            { name: "쌀국수 🍜", category: "분식/기타" },
            { name: "타코 / 브리또 🌮", category: "분식/기타" }
        ];

        let currentCategory = "전체";

        // 카테고리 변경 함수
        function setCategory(category, button) {
            currentCategory = category;
            
            // 버튼 활성화 스타일 변경
            const buttons = document.querySelectorAll('.btn-filter');
            buttons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            // 카테고리 태그 텍스트 변경
            document.getElementById('categoryTag').innerText = category;
            document.getElementById('menuDisplay').innerText = "추천받기 버튼을 눌러보세요!";
        }

        // 메뉴 추천 랜덤 추출 함수
        function recommendMenu() {
            // 선택된 카테고리에 맞는 메뉴만 필터링
            let filteredMenu = menuList;
            if (currentCategory !== "전체") {
                filteredMenu = menuList.filter(item => item.category === currentCategory);
            }

            const menuDisplay = document.getElementById('menuDisplay');
            
            // 슬롯머신 효과 (선택되는 것처럼 빠르게 텍스트 변환)
            let count = 0;
            const interval = setInterval(() => {
                const tempIndex = Math.floor(Math.random() * filteredMenu.length);
                menuDisplay.innerText = filteredMenu[tempIndex].name;
                count++;

                if (count > 10) { // 10번 번쩍인 후 최종 선택
                    clearInterval(interval);
                    const finalIndex = Math.floor(Math.random() * filteredMenu.length);
                    const selected = filteredMenu[finalIndex];
                    menuDisplay.innerText = selected.name;
                    document.getElementById('categoryTag').innerText = selected.category;
                }
            }, 50);
        }
    </script>
</body>
</html>
